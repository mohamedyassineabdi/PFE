version: "3.9"
services:
  cx-db:
    image: postgres:16
    container_name: cx-assessment-db
    environment:
      POSTGRES_DB: cx_assessment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Barbouch123!
    ports:
      - "5433:5432"
    volumes:
      - cx_assessment_data:/var/lib/postgresql/data
    restart: unless-stopped

  metabase-db:
    image: postgres:16
    container_name: metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: change_me
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: change_me
      MB_DB_HOST: metabase-db
    depends_on:
      - metabase-db
    restart: unless-stopped

volumes:
  cx_assessment_data:
  metabase_db_data:
