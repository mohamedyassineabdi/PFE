<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Set Password - EY Studio+ Internal Portal</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="assets/imgs/66e9a1b24861e4af25ba59f3_CGPT Favicon 32x32.png" rel="shortcut icon" type="image/x-icon" />
    <link rel="stylesheet" href="assets/Style/admin.css" />
</head>
<body class="admin-page">
    <main class="password-shell" aria-labelledby="password-title">
        <div class="admin-login-frame">
            <div class="admin-brand" aria-hidden="true">
                <span class="admin-brand-mark"></span>
                <span class="admin-brand-lockup"><span>EY</span><span>Studio</span><span>+</span></span>
                <span class="admin-brand-tagline">Secure account setup</span>
            </div>
            <form id="set-password-form" class="admin-card" novalidate>
                <div>
                    <p class="admin-kicker">Invitation</p>
                    <h1 id="password-title" class="admin-title">Set password</h1>
                </div>
                <label class="admin-field">
                    <span>New password</span>
                    <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
                </label>
                <label class="admin-field">
                    <span>Confirm password</span>
                    <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
                </label>
                <p id="set-password-message" class="admin-error" role="alert" aria-live="polite"></p>
                <button class="admin-button" type="submit">Save password</button>
            </form>
        </div>
    </main>
    <script src="assets/JavaScript/portal-api.js"></script>
    <script src="assets/JavaScript/set-password.js"></script>
</body>
</html>
