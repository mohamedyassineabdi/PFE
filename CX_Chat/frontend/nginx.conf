server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ALB path-prefix routing: /cx/* -> html root (relative-path SPA build)
    location /cx/ {
        rewrite ^/cx/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ @spa;
    }

    # Legacy ALB routes redirect into the /cx prefix so relative Vite assets
    # resolve under the CX frontend target group instead of the portal root.
    location = /admin {
        return 302 /cx/admin;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /cx/admin/$1 redirect;
    }

    location = /timeline-preview {
        return 302 /cx/timeline-preview;
    }

    location /timeline-preview/ {
        rewrite ^/timeline-preview/(.*)$ /cx/timeline-preview/$1 redirect;
    }

    location @spa {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }

    # Custom domain (base path is empty) or direct container access
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
