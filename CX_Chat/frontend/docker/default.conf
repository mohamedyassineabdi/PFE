server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location = /cx {
        return 302 /cx/;
    }

    location = /admin {
        return 302 /admin/;
    }

    location = /timeline-preview {
        return 302 /timeline-preview/;
    }

    location ~ ^/(cx|admin|timeline-preview)/(.*)$ {
        rewrite ^/(cx|admin|timeline-preview)/(.*)$ /$2 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
